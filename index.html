<script>
const PUB_ID = "2PACX-1vQUVe19uFKWsubVgwU1-U-_OnzR2dSo7zaPz5911uKaCg-b62wX8p-s3CY4sVFUdv4xDd1YqNDKAFFF";
const ETS2_GID = "1587396084";
const ATS_GID = "0";

const ETS2_CSV = `https://docs.google.com/spreadsheets/d/e/${PUB_ID}/pub?gid=${ETS2_GID}&single=true&output=csv`;
const ATS_CSV  = `https://docs.google.com/spreadsheets/d/e/${PUB_ID}/pub?gid=${ATS_GID}&single=true&output=csv`;

function sanitizeText(str) {
  if (!str) return '';
  return str
    .replace(/\\/g, '')
    .replace(/^#+\s*/, '')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .replace(/[<>]/g, '')
    .trim();
}

// Cleans URLs and automatically turns Google Drive share links into direct downloads
function cleanUrl(url) {
  if (!url) return '#';
  
  // Clean raw formatting
  let clean = url.replace(/[<>"\\]/g, '').trim();

  // If link is a Google Drive share link, force direct download format
  if (clean.includes("drive.google.com/file/d/")) {
    const fileIdMatch = clean.match(/\/d\/([^\/]+)/);
    if (fileIdMatch && fileIdMatch[1]) {
      return `https://drive.google.com/uc?export=download&id=${fileIdMatch[1]}`;
    }
  }

  // If link is a Dropbox share link, force direct download format
  if (clean.includes("dropbox.com") && clean.includes("dl=0")) {
    return clean.replace("dl=0", "dl=1");
  }

  return clean;
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const char = line[i];
    if (char === '"' && line[i + 1] === '"') {
      current += '"';
      i++;
    } else if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === ',' && !inQuotes) {
      result.push(current.trim());
      current = '';
    } else {
      current += char;
    }
  }
  result.push(current.trim());
  return result;
}

async function loadList(csvUrl, elementId) {
  const container = document.getElementById(elementId);
  try {
    const response = await fetch(csvUrl);
    if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
    
    const text = await response.text();
    const lines = text.split(/\r?\n/).filter(line => line.trim().length > 0);
    
    if (lines.length <= 1) {
      container.innerHTML = '<div class="state-message">No files available in this section.</div>';
      return;
    }

    container.innerHTML = '';
    const dataLines = lines.slice(1);

    dataLines.forEach(line => {
      const cols = parseCSVLine(line);
      if (cols.length >= 2 && cols[1]) {
        const rawNum = sanitizeText(cols[0]) || '-';
        const rawName = sanitizeText(cols[1]) || 'Unknown File';
        const rawMeta = sanitizeText(cols[2]) || 'Latest';
        const rawLink = cleanUrl(cols[3]);

        if (rawName === '---' || rawName.length === 0) return;

        const card = document.createElement('div');
        card.className = 'mod-card';
        card.innerHTML = `
          <div class="mod-order">${rawNum}</div>
          <div class="mod-title">${rawName}</div>
          <div class="mod-meta">${rawMeta}</div>
          <a class="btn-download-mod" href="${rawLink}" target="_blank" rel="noopener noreferrer">Download</a>
        `;
        container.appendChild(card);
      }
    });
  } catch (err) {
    console.error(`Error loading ${elementId}:`, err);
    container.innerHTML = `
      <div class="state-message" style="color: #f87171;">
        Failed to load downloads. Please check back shortly.
      </div>`;
  }
}

function filterMods() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const cards = document.querySelectorAll('.mod-card');
  
  cards.forEach(card => {
    const title = card.querySelector('.mod-title').textContent.toLowerCase();
    card.style.display = title.includes(query) ? 'grid' : 'none';
  });
}

loadList(ETS2_CSV, 'ets2-list');
loadList(ATS_CSV, 'ats-list');
</script>
